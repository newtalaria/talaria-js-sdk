name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@newtalaria/core"
          - "@newtalaria/browser"
          - "@newtalaria/node"
          - "@newtalaria/react"
          - "@newtalaria/nextjs"
          - "@newtalaria/cli"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test -w ${{ matrix.workspace }}
